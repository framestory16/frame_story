# Supabase pauses free projects after 7 days without activity.
# This reads one row every 2 days so the project never goes idle.
# (Backup for the cron-job.org ping — see README.)
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 3 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: |
          curl -fsS "https://qriipkojtrgerlvexszo.supabase.co/rest/v1/settings?select=id&limit=1" \
            -H "apikey: sb_publishable_3-WiHPpqxUeDNlZfwHpGpg_p7ClzRsP"
