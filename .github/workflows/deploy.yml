# Builds both websites and publishes them to GitHub Pages on every push to main.
#   Shop:  https://<user>.github.io/<repo>/
#   Admin: https://<user>.github.io/<repo>/admin/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PAGES_BASE: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Combine shop + admin into one site
        run: |
          mkdir -p site
          cp -r dist/customer/. site/
          cp -r dist/admin site/admin
          # GitHub Pages has no SPA fallback: serve the shop for unknown paths
          cp site/index.html site/404.html
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
